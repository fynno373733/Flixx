
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
  font-family: Arial, sans-serif;
  color: #ffe600;
  background:
    radial-gradient(ellipse at top, #292500 0%, #0a0a0a 55%, #000 100%);
  overflow-x: hidden;
}

.profile {
  text-align: center;
  width: 100%;
  max-width: 420px;
  padding: 30px 20px;
  background: rgba(10, 10, 10, 0.8);
  border: 1px solid #665d00;
  border-radius: 24px;
  box-shadow: 0 0 35px rgba(255, 230, 0, 0.12);
  animation: appear 1s ease;
}

.avatar {
  width: 115px;
  height: 115px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #ffe600;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffe600, #332e00);
  color: #050505;
  font-size: 52px;
  box-shadow: 0 0 25px rgba(255, 230, 0, 0.35);
}

h1 {
  margin: 10px 0;
  font-size: clamp(27px, 8vw, 40px);
  font-weight: 900;
  letter-spacing: 3px;
  color: #ffe600;
  text-shadow: 0 0 15px rgba(255, 230, 0, 0.5);
  animation: glow 2s ease-in-out infinite alternate;
}

.subtitle {
  color: #bdb56a;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 30px;
}

.link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 15px;
  width: 100%;
  min-height: 68px;
  padding: 15px 18px;
  margin: 15px 0;
  border: 1px solid #ffe600;
  border-radius: 14px;
  color: #ffe600;
  background: #101010;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-align: left;
  transition: 0.25s ease;
  box-shadow: 0 0 12px rgba(255, 230, 0, 0.06);
}

.link:hover {
  background: #ffe600;
  color: #050505;
  transform: translateY(-3px);
  box-shadow: 0 0 25px rgba(255, 230, 0, 0.35);
}

.symbol {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 35px;
  font-size: 27px;
}

.link-text {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.coming {
  font-size: 10px;
  font-weight: normal;
  letter-spacing: 3px;
}

.arrow {
  margin-left: auto;
  font-size: 22px;
}

.link.disabled {
  cursor: default;
}

.link.disabled:hover {
  background: #101010;
  color: #ffe600;
  transform: none;
  box-shadow: 0 0 12px rgba(255, 230, 0, 0.06);
}

.footer {
  margin-top: 30px;
  color: #89824b;
  font-size: 11px;
  letter-spacing: 3px;
}

.line {
  width: 70px;
  height: 2px;
  background: #ffe600;
  margin: 0 auto 18px;
  box-shadow: 0 0 10px #ffe600;
}

@keyframes glow {
  from {
    text-shadow: 0 0 5px #ffe600;
  }
  to {
    text-shadow: 0 0 22px #ffe600;
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<main class="profile">

  <div class="avatar">♛</div>

  <!-- ÄNDERE YOUR NAME ZU DEINEM NAMEN -->
  <h1>Flixx</h1>

  <p class="subtitle">✦Welcome to my Website✦</p>

  <!-- YOUTUBE BUTTON -->
  <a class="link"
     href="https://www.youtube.com/@FlixxVR45"
     target="_blank"
     rel="noopener noreferrer">
    <span class="symbol">▶</span>
    <span class="link-text">YOUTUBE</span>
    <span class="arrow">↗</span>
  </a>

  <!-- DISCORD BUTTON -->
  <a class="link"
     href="https://discord.gg/pMRMScqFt"
     target="_blank"
     rel="noopener noreferrer">
    <span class="symbol">☏</span>
    <span class="link-text">DISCORD</span>
    <span class="arrow">↗</span>
  </a>

  <!-- TIKTOK: COMING SOON -->
  <a class="link disabled"
     href="#"
     aria-disabled="true"
     onclick="return false;">
    <span class="symbol">♪</span>
    <span class="link-text">
      TIKTOK
      <span class="coming">COMMING SOON</span>
    </span>
    <span class="arrow">✦</span>
  </a>

  <div class="footer">
    <div class="line"></div>
    ♛ &nbsp; More Comming soon
  </div>

</main>

</body>
</html>
